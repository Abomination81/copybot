[package]
autobins = false
name = "copybot-hot"
version = "0.1.0"
description = "Abomination81 Copybot — self-hosted copy-trading execution engine"
homepage = "https://x.com/Abomination81"
repository = "https://github.com/Abomination81/copybot"
edition = "2021"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
name = "copybot_hot"
path = "src/lib.rs"

[[bin]]
name = "copybot-hot"
path = "src/main.rs"
